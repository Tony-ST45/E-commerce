<div class="min-h-screen bg-white font-sans antialiased flex selection:bg-black selection:text-white">

  <!-- Left Side: Immersive Visual -->
  <div class="hidden lg:block w-[45%] relative">
    <img 
      src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1976&auto=format&fit=crop" 
      class="absolute inset-0 w-full h-full object-cover"
      alt="Luxury Fashion"
    />
    <!-- Sophisticated Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
    
    <div class="absolute inset-0 flex flex-col justify-between p-16 z-10">
      <div class="text-white text-2xl font-bold tracking-tighter uppercase">
        The Edit
      </div>
      
      <div class="text-white">
        <h2 class="text-6xl font-light leading-tight mb-4">
          Curated <br/> <span class="italic font-serif text-7xl">Excellence</span>
        </h2>
        <div class="h-1 w-12 bg-white mb-6"></div>
        <p class="text-white/70 tracking-[0.2em] uppercase text-xs">
          Exclusive access to the 2026 collection
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Login Interface -->
  <div class="w-full lg:w-[55%] flex flex-col justify-center bg-white">
    
    <div class="max-w-110 w-full mx-auto px-6 py-12">
      
      <header class="mb-12">
        <h1 class="text-4xl font-serif text-zinc-900 mb-3">Welcome back</h1>
        <p class="text-zinc-500 font-medium">Please enter your credentials to continue.</p>
      </header>

      <form (ngSubmit)="login()" class="space-y-8">
        
        <!-- Input Group -->
        <div class="space-y-6">
          <div class="group relative">
            <label class="text-[10px] uppercase tracking-[0.15em] font-bold text-zinc-400 mb-1 block transition-colors group-focus-within:text-black">
              Email Address
            </label>
            <input 
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="e.g. julian@theedit.com"
              class="w-full pb-3 pt-1 bg-transparent border-b border-zinc-200 focus:border-black outline-none transition-all duration-500 placeholder:text-zinc-300 text-zinc-900"
            />
          </div>

          <div class="group relative">
            <div class="flex justify-between items-end mb-1">
              <label class="text-[10px] uppercase tracking-[0.15em] font-bold text-zinc-400 transition-colors group-focus-within:text-black">
                Password
              </label>
              <a href="#" class="text-[10px] uppercase tracking-widest text-zinc-400 hover:text-black transition-colors underline underline-offset-4">
                Reset?
              </a>
            </div>
            <input 
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="••••••••••••"
              class="w-full pb-3 pt-1 bg-transparent border-b border-zinc-200 focus:border-black outline-none transition-all duration-500 placeholder:text-zinc-300 text-zinc-900"
            />
          </div>
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between">
          <label class="flex items-center cursor-pointer group">
            <input
              type="checkbox"
              [(ngModel)]="remember"
              name="remember"
              class="w-4 h-4 border-zinc-300 rounded text-black focus:ring-black transition-all"
            />
            <span class="ml-3 text-xs text-zinc-500 group-hover:text-zinc-800 transition-colors">
              Remember for 30 days
            </span>
          </label>
        </div>

        <!-- Actions -->
        <div class="pt-4 space-y-4">
          <button
            type="submit"
            class="w-full bg-zinc-900 text-white py-5 rounded-sm font-bold uppercase tracking-[0.2em] text-xs hover:bg-black transition-all shadow-[0_10px_20px_-10px_rgba(0,0,0,0.3)] hover:shadow-[0_15px_25px_-10px_rgba(0,0,0,0.4)] active:scale-[0.99]"
          >
            Authenticate
          </button>

        </div>
      </form>

      <!-- Footer Sign Up -->
      <p class="mt-10 text-center text-xs tracking-wide text-zinc-500">
        New to the collection? 
        <a routerLink="/register" class="text-black font-bold uppercase ml-2 hover:underline underline-offset-4">
          Create Account
        </a>
      </p>
    </div>

    <!-- Legal -->
    <footer class="mt-auto p-12 flex flex-wrap gap-8 text-[9px] uppercase tracking-[0.3em] text-zinc-300 justify-center lg:justify-start">
      <a class="hover:text-black transition-colors cursor-pointer">Privacy</a>
      <a class="hover:text-black transition-colors cursor-pointer">Terms</a>
      <a class="hover:text-black transition-colors cursor-pointer">Cookies</a>
      <span class="ml-auto">&copy; 2026 The Edit Limited</span>
    </footer>
    
  </div>
</div>
