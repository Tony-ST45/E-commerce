<div class="min-h-screen bg-gray-50 py-12 px-6">

  <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-10">

    <!-- ================= Shipping Address ================= -->

    <div class="bg-white p-8 rounded-2xl shadow-sm border">

      <h2 class="text-2xl font-bold mb-6">
        Shipping Address
      </h2>

      <div class="space-y-4">

        <input
          placeholder="Full Name"
          [(ngModel)]="address.name"
          class="w-full border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition"
        />

        <input
          placeholder="Phone Number"
          [(ngModel)]="address.phone"
          class="w-full border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition"
        />

        <textarea
          rows="3"
          placeholder="Full Address"
          [(ngModel)]="address.address"
          class="w-full border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition"
        ></textarea>

        <div class="grid grid-cols-2 gap-4">

          <input
            placeholder="City"
            [(ngModel)]="address.city"
            class="border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition"
          />

          <input
            placeholder="Pincode"
            [(ngModel)]="address.pincode"
            class="border border-gray-200 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition"
          />

        </div>

      </div>

    </div>


    <!-- ================= Order Summary ================= -->

    <div class="bg-white p-8 rounded-2xl shadow-sm border h-fit sticky top-24">

      <h2 class="text-2xl font-bold mb-6">
        Order Summary
      </h2>

      <!-- Products -->
      <div *ngFor="let item of cart"
           class="flex justify-between items-center py-2 border-b text-sm">

        <span class="text-gray-600">
          {{item.title}} × {{item.quantity}}
        </span>

        <span class="font-semibold">
          ₹{{item.price * item.quantity}}
        </span>

      </div>

      <!-- Total -->

      <div class="flex justify-between mt-6 text-lg font-bold">

        <span>Total</span>
        <span>₹{{total}}</span>

      </div>


      <!-- ================= Payment Method ================= -->

      <h2 class="text-xl font-bold mt-8 mb-4">
        Payment Method
      </h2>

      <div class="space-y-3">

        <label class="flex items-center gap-3 border p-3 rounded-lg cursor-pointer hover:bg-gray-50">

          <input type="radio" value="COD" [(ngModel)]="paymentMethod">

          <span>Cash on Delivery</span>

        </label>

        <label class="flex items-center gap-3 border p-3 rounded-lg cursor-pointer hover:bg-gray-50">

          <input type="radio" value="UPI" [(ngModel)]="paymentMethod">

          <span>UPI / Razorpay</span>

        </label>

        <label class="flex items-center gap-3 border p-3 rounded-lg cursor-pointer hover:bg-gray-50">

          <input type="radio" value="CARD" [(ngModel)]="paymentMethod">

          <span>Credit / Debit Card</span>

        </label>

      </div>


      <!-- ================= Pay Button ================= -->

      <button
        (click)="checkout()"
        [disabled]="loading"
        class="mt-8 w-full flex items-center justify-center gap-2 bg-black text-white py-4 rounded-xl font-semibold hover:bg-gray-900 transition disabled:opacity-50 shadow">

        <span *ngIf="!loading">💳 Pay Now</span>
        <span *ngIf="loading">Processing Payment...</span>

      </button>

    </div>

  </div>

</div>
